<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Liebe</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&family=Jost:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one dark card in the middle of a charcoal page, Stranger Chess style. Wordmark on top, a row of small labels, his words large. Tap the card for the next one. */
@font-face{font-family:"NDK Local";src:local("ND Kern"),local("NDKern-Regular"),local("ND Kern Regular");font-weight:400}
@font-face{font-family:"NDK Local";src:local("ND Kern Light"),local("NDKern-Light");font-weight:300}
@font-face{font-family:"NDK Local";src:local("ND Kern Bold"),local("NDKern-Bold");font-weight:700}
@font-face{font-family:"NDK Local";src:local("ND Kern ExtraBold"),local("NDKern-ExtraBold"),local("ND Kern Extra Bold");font-weight:800}
:root{
  --page:#1c1d1f;
  --card:#111113;
  --line:#ffffff1f;
  --cream:#f3e9e8;
  --dim:#9c9494;
  --sans:"NDK Local","ND Kern","Jost",futura,"Futura PT",sans-serif;
  --mark:"Fraunces","ITC Benguiat",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--cream);font-family:var(--sans);letter-spacing:.6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:32px 16px;min-height:100%}
.mark{display:flex;flex-direction:column;align-items:center;font-family:var(--mark);font-weight:800;font-variation-settings:"opsz" 144;text-transform:uppercase;line-height:.86;user-select:none}
.mark .top{font-size:clamp(46px,11vw,78px);letter-spacing:.01em}
.mark .bot{display:flex;align-items:center;gap:12px;font-size:clamp(40px,9.4vw,66px)}
.mark .bot::before,.mark .bot::after{content:"";height:3px;width:clamp(36px,10vw,72px);background:var(--cream)}
.card{all:unset;box-sizing:border-box;width:min(560px,100%);min-height:400px;background:var(--card);border-radius:12px;padding:30px 30px 26px;display:flex;flex-direction:column;gap:24px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .18s ease}
.card:hover{transform:translateY(-2px)}
.card:active{transform:scale(.99)}
.card:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.meta{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta span{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--cream);opacity:.85}
.meta b{font-size:12px;font-weight:800;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tag{margin-left:auto;align-self:center;border:1px solid var(--cream);border-radius:5px;padding:3px 7px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.msg p{margin:0;font-weight:300;font-size:clamp(22px,4.6vw,30px);line-height:1.28;white-space:pre-line;text-wrap:pretty;overflow-wrap:anywhere}
.msg p.long{font-size:clamp(17px,3.4vw,20px);line-height:1.5}
.msg .tr{font-size:14px;color:var(--dim);font-weight:400}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim)}
.foot strong{color:var(--cream);font-weight:800}
.fade{transition:opacity .22s ease,transform .22s ease}
.out{opacity:0;transform:translateY(6px)}
@media (prefers-reduced-motion:reduce){.fade,.card{transition:none}}
@media (max-width:420px){.card{padding:24px 20px 20px;min-height:360px}}

body.locked{background:#808080}
body.locked .card{display:none}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#808080;padding:16px}
#gate input{font:inherit;font-size:18px;width:min(280px,100%);padding:12px 14px;border:0;border-radius:6px;background:#9a9a9a;color:#1c1d1f;outline:none;text-align:center;letter-spacing:2px}
#gate input:focus-visible{box-shadow:0 0 0 2px #1c1d1f55}
#gate.no input{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){#gate.no input{animation:none}}
</style>
</head>
<body class="locked">
<form id="gate" autocomplete="off"><label for="pw" style="position:absolute;left:-9999px">Password</label><input id="pw" type="password" autocomplete="off" aria-label="Password"></form>
<div class="card" id="card" role="button" tabindex="0" aria-label="Show another message">
  <div class="meta fade" id="meta">
    <div><span>Von</span><b>Wolf</b></div>
    <div><span>Datum</span><b id="date">4 May</b></div>
    <div><span>Nr.</span><b id="num">1</b></div>
  </div>
  <div class="msg fade" id="msg" aria-live="polite">
    <p id="text">your eyes are beautiful
i love your voice</p>
    <span class="tr" id="tr" hidden></span>
  </div>
  <div class="foot"><span>Tap for <strong>another</strong></span><span id="count"></span></div>
</div>

<script>
let N=[];
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const fmt=d=>{const[y,m,dd]=d.split("-");return +dd+" "+MON[+m-1]};
const $=id=>document.getElementById(id);
let deck=[],cur=-1;
function shuffle(){deck=[...N.keys()];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}if(deck[deck.length-1]===cur)deck.reverse()}
function show(i){
  const [d,t,tr]=N[i];cur=i;
  $("date").textContent=fmt(d);
  $("num").textContent=String(i+1).padStart(3,"0");
  const p=$("text");p.textContent=t;p.classList.toggle("long",t.length>150);
  const T=$("tr");if(tr){T.textContent=tr;T.hidden=false}else{T.hidden=true}
}
function next(){
  if(!deck.length)shuffle();
  const i=deck.pop();
  const els=[$("meta"),$("msg")];
  els.forEach(e=>e.classList.add("out"));
  setTimeout(()=>{show(i);els.forEach(e=>e.classList.remove("out"))},200);
}
$("card").addEventListener("click",next);
$("card").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}});

const ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(LOCK.s),iterations:LOCK.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(LOCK.i)},key,ub(LOCK.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const gate=$("gate"),pw=$("pw");
gate.addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    N=await unlock(pw.value.trim().toLowerCase());
    $("count").textContent=N.length+" Nachrichten";
    shuffle();show(deck.pop());
    gate.remove();document.body.classList.remove("locked");
  }catch(_){pw.value="";gate.classList.remove("no");void gate.offsetWidth;gate.classList.add("no")}
});
pw.focus();
</script>
